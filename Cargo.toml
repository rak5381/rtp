[package]
name = "rtp"
version = "0.2.0"
authors = ["Takeru Ohta <phjgt308@gmail.com>", "rak5381"]
description = "RTP/SRTP implementation - modernized from original 0.1.0"
edition = "2021"

[features]
default = []
rfc5764-openssl = ["tokio-openssl"]

[dependencies]
aes = "0.8"
ctr = "0.9"
async-trait = "0.1"
fixedbitset = "0.4"
futures = "0.3"
handy_async = "0.2"
hmac = "0.12"
sha1 = "0.10"
trackable = "0.1"

tokio-openssl = { version = "0.6", optional = true }

[dev-dependencies]
clap = "2"
fibers = "0.1"
futures01 = { package = "futures", version = "0.1" }
